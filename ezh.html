<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ёж - справочник о животных</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f5f5f5;
            color: #2b2b2b;
            margin: 0;
            padding: 60px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card {
            background: #ffffff;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            padding: 35px 45px;
            max-width: 600px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .card h1 {
            color: #333;
            margin-top: 0;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 15px;
        }

        .card img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin: 15px 0;
            border-radius: 6px;
        }

        .card p {
            color: #555;
            line-height: 1.6;
            text-align: left;
        }

        .card a {
            display: inline-block;
            margin-top: 20px;
            background: #444;
            color: #fff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 4px;
            font-size: 14px;
        }

        .card a:hover {
            background: #222;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ёж</h1>
        <img src="Ёж.jpg" alt="Ёж">
        <p>
            <strong>Ёж</strong> — маленький колючий житель сада.
            Любит яблоки, грибы и ночные прогулки.
            Однажды притащил в норку яблоко больше себя — и застрял в проходе.
            Пришлось звать на помощь весь ежиный род.
        </p>
        <a href="animals.html">← Вернуться к списку</a>
    </div>

</body>
</html>
